networks:
  app-network:
    driver: bridge

services:
  wa-bot-ai:
    build:
      context: .
    ports:
      - "8000:8000"
    container_name: wa-bot-ai
    networks:
      - app-network
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/vectordb

  waha:
    image: devlikeapro/waha:latest
    container_name: wa_bot_waha
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - ./waha-data:/app/data
    networks:
      - app-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: wa_bot_postgres
    restart: always
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:
